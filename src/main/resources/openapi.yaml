openapi: 3.0.3

info:
  title: Veritae Auth & Member API
  version: 0.1.0
  description: Veritae 인증(회원가입/로그인/토큰 갱신) 및 회원 정보 조회 API.

servers:
  - url: http://localhost:8080
    description: 로컬 개발 서버

tags:
  - name: Auth
    description: 회원가입, 로그인, 토큰 갱신
  - name: Members
    description: 회원 정보 조회
  - name: Analysis
    description: 이미지 AI 생성 여부 분석

paths:
  /api/v1/auth/signup:
    post:
      tags: [Auth]
      operationId: signup
      summary: 회원가입
      description: 이메일/비밀번호/닉네임으로 신규 회원을 생성한다. 비밀번호는 응답에 포함되지 않는다.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
      responses:
        '201':
          description: 회원 생성 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/EmailConflict'
        default:
          $ref: '#/components/responses/ServerError'

  /api/v1/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: 로그인
      description: 자격 증명 검증 후 access/refresh 토큰(JWT)을 발급한다.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 로그인 성공, 토큰 발급
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        default:
          $ref: '#/components/responses/ServerError'

  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshToken
      summary: 액세스 토큰 갱신
      description: 유효한 refreshToken 으로 새 accessToken 을 발급한다. refreshToken 은 회전하지 않는다.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: 새 액세스 토큰 발급
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/InvalidRefreshToken'
        default:
          $ref: '#/components/responses/ServerError'

  /api/v1/members/me:
    get:
      tags: [Members]
      operationId: getMyProfile
      summary: 내 정보 조회
      description: Bearer 액세스 토큰으로 인증된 회원 본인의 정보를 반환한다.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 내 정보 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/ServerError'

  /api/v1/analysis/image:
    post:
      tags: [Analysis]
      operationId: analyzeImage
      summary: 이미지 AI 생성 여부 분석
      description: >-
        업로드한 이미지가 AI로 생성되었을 확률을 점수로 반환한다. 탐지 서버(별도 인프라) 호출이 끝날 때까지
        응답을 기다리는 동기 방식이다 - 분석에 수 초~수십 초가 걸릴 수 있다.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: 분석할 이미지 파일(jpeg/png/webp).
      responses:
        '200':
          description: 분석 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageAnalysisResponse'
              example:
                aiDetection:
                  model: spai
                  score: 0.000134
        '400':
          $ref: '#/components/responses/InvalidImageFile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '502':
          $ref: '#/components/responses/DetectionServiceUnavailable'
        default:
          $ref: '#/components/responses/ServerError'

  /api/v1/analysis/audio:
    post:
      tags: [Analysis]
      operationId: analyzeAudio
      summary: 음성 AI 생성 여부 분석
      description: >-
        업로드한 음성이 AI로 생성(합성)되었을 확률과 판독 근거를 반환한다. 탐지 서버(별도 인프라) 호출이 끝날 때까지
        응답을 기다리는 동기 방식이다.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: 분석할 음성 파일(wav/mp3/m4a/aac, 최대 5분/25MB).
      responses:
        '200':
          description: 분석 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AudioAnalysisResponse'
        '400':
          $ref: '#/components/responses/InvalidAudioFile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '502':
          $ref: '#/components/responses/DetectionServiceUnavailable'
        default:
          $ref: '#/components/responses/ServerError'

  /api/v1/analysis/video:
    post:
      tags: [Analysis]
      operationId: analyzeVideo
      summary: 영상 AI 생성 여부(얼굴조작 딥페이크) 분석 요청
      description: >-
        업로드한 영상의 얼굴조작(face-swap) 딥페이크 여부 분석을 비동기 작업으로 접수한다.
        처리에 수십 초~수 분이 걸릴 수 있어 즉시 202로 jobId를 반환하고, 결과는
        GET /api/v1/analysis/jobs/{jobId}로 폴링해 확인한다. 완전 생성형(Sora류) 영상 탐지는
        지원하지 않는다 - 얼굴조작 딥페이크만 판독한다.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: 분석할 영상 파일(mp4/mov/avi, 최대 100MB).
      responses:
        '202':
          description: 분석 작업 접수됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisJobAcceptedResponse'
        '400':
          $ref: '#/components/responses/InvalidVideoFile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/ServerError'

  /api/v1/analysis/jobs/{jobId}:
    get:
      tags: [Analysis]
      operationId: getAnalysisJob
      summary: 분석 작업 상태/결과 조회
      description: >-
        POST /api/v1/analysis/video 로 접수한 작업의 현재 상태를 조회한다. status가
        COMPLETED일 때만 aiDetection이, FAILED일 때만 errorMessage가 채워진다. 본인이
        접수한 작업이 아니면 404를 반환한다(다른 사용자 작업의 존재 여부를 숨기기 위함).
      security:
        - bearerAuth: []
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisJobResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/AnalysisJobNotFound'
        default:
          $ref: '#/components/responses/ServerError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "JWT 액세스 토큰. `Authorization: Bearer <accessToken>` 헤더로 전달한다."

  schemas:
    SignupRequest:
      type: object
      required: [email, password, nickname]
      properties:
        email:
          type: string
          format: email
          nullable: false
          maxLength: 254
          description: 로그인 식별자로 사용되는 이메일. 시스템 내 유일해야 한다.
          example: user@veritae.app
        password:
          type: string
          format: password
          nullable: false
          minLength: 8
          maxLength: 20
          pattern: '^(?=.*[A-Za-z])(?=.*\d).{8,20}$'
          description: 8~20자, 영문자와 숫자를 각각 1자 이상 포함. 응답에는 절대 포함되지 않는다.
          example: veritae123
        nickname:
          type: string
          nullable: false
          minLength: 2
          maxLength: 10
          pattern: '^[\p{L}\p{N}]{2,10}$'
          description: 2~10자, 유니코드 문자/숫자(한글 허용), 공백·특수문자 불가.
          example: 진실이

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          nullable: false
          maxLength: 254
          example: user@veritae.app
        password:
          type: string
          format: password
          nullable: false
          minLength: 1
          maxLength: 20
          description: 로그인 시에는 형식 검증만 최소로 수행한다(실제 판정은 자격 증명 검증에서).
          example: veritae123

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          nullable: false
          minLength: 1
          description: 로그인 시 발급받은 refresh 토큰(JWT).
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...

    TokenResponse:
      type: object
      required: [accessToken, refreshToken, tokenType, expiresIn]
      properties:
        accessToken:
          type: string
          nullable: false
          description: 보호 API 호출에 사용하는 단기 JWT.
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        refreshToken:
          type: string
          nullable: false
          description: accessToken 갱신에 사용하는 장기 JWT.
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        tokenType:
          type: string
          nullable: false
          enum: [Bearer]
          description: 토큰 타입. 항상 "Bearer".
          example: Bearer
        expiresIn:
          type: integer
          format: int64
          nullable: false
          minimum: 1
          description: accessToken 만료까지 남은 시간(초). 기본 1800초(30분).
          example: 1800

    AccessTokenResponse:
      type: object
      required: [accessToken, tokenType, expiresIn]
      properties:
        accessToken:
          type: string
          nullable: false
          description: 새로 발급된 단기 JWT.
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        tokenType:
          type: string
          nullable: false
          enum: [Bearer]
          example: Bearer
        expiresIn:
          type: integer
          format: int64
          nullable: false
          minimum: 1
          description: accessToken 만료까지 남은 시간(초). 기본 1800초(30분).
          example: 1800

    MemberResponse:
      type: object
      required: [id, email, nickname]
      properties:
        id:
          type: string
          format: uuid
          nullable: false
          description: 회원의 공개 식별자(UUID). 순차 증가 PK 를 외부에 노출하지 않는다.
          example: 3f2504e0-4f89-41d3-9a0c-0305e82c3301
        email:
          type: string
          format: email
          nullable: false
          example: user@veritae.app
        nickname:
          type: string
          nullable: false
          example: 진실이

    ImageAnalysisResponse:
      type: object
      required: [aiDetection]
      properties:
        aiDetection:
          $ref: '#/components/schemas/ImageDetectionResult'

    AudioAnalysisResponse:
      type: object
      required: [aiDetection]
      properties:
        aiDetection:
          $ref: '#/components/schemas/AudioDetectionResult'

    AnalysisJobAcceptedResponse:
      type: object
      required: [jobId]
      properties:
        jobId:
          type: string
          format: uuid
          nullable: false
          description: 생성된 분석 작업 ID. GET /api/v1/analysis/jobs/{jobId}로 상태를 조회한다.
          example: 11111111-1111-1111-1111-111111111111

    AnalysisJobResponse:
      type: object
      required: [jobId, status]
      properties:
        jobId:
          type: string
          format: uuid
          nullable: false
          example: 11111111-1111-1111-1111-111111111111
        status:
          type: string
          nullable: false
          enum: [PENDING, PROCESSING, COMPLETED, FAILED]
          description: 작업 처리 상태.
          example: COMPLETED
        aiDetection:
          allOf:
            - $ref: '#/components/schemas/VideoDetectionResult'
          nullable: true
          description: status가 COMPLETED일 때만 채워진다.
        errorCode:
          type: string
          nullable: true
          description: >-
            status가 FAILED일 때만 채워지는 기계 판독용 실패 사유. 현재 값: NO_FACE_DETECTED(영상에서
            얼굴을 찾지 못함 - 다른 영상으로 재시도 유도), ANALYSIS_FAILED(그 외 처리 실패 - 같은 영상으로
            재시도 가능). errorMessage와 달리 문구가 바뀌어도 값은 유지되므로 분기 처리엔 이 필드를 쓴다.
          example: NO_FACE_DETECTED
        errorMessage:
          type: string
          nullable: true
          description: status가 FAILED일 때만 채워지는, 사용자에게 그대로 보여줄 문구. 분기 처리에는 errorCode를 쓴다.

    ImageDetectionResult:
      type: object
      required: [model, score]
      description: >-
        이미지 AI 판독 결과. SPAI는 근거 카드(evidence)를 만들지 않아 그 필드는 없다.
        evidenceImage는 SPAI의 attention 히트맵(원본 사진 위에 합성된 오버레이)이다.
      properties:
        model:
          type: string
          nullable: false
          description: 탐지에 사용된 모델 이름.
          example: spai
        score:
          type: number
          format: double
          nullable: false
          minimum: 0
          maximum: 1
          description: AI 생성물일 확률(0~1). 1에 가까울수록 AI 생성 가능성이 높다.
          example: 0.000134
        evidenceImage:
          type: string
          nullable: true
          description: >-
            판독 근거 히트맵 이미지(base64 인코딩 PNG). 이미지의 어느 부분이 의심스러운지
            시각적으로 보여준다(best-effort - 실패하면 null).

    AudioDetectionResult:
      type: object
      required: [model, score, evidence]
      description: 음성 AI 판독 결과. 공간적 근거(이미지) 개념이 없어 evidenceImage 필드는 없다.
      properties:
        model:
          type: string
          nullable: false
          description: 탐지에 사용된 모델 이름.
          example: antideepfake
        score:
          type: number
          format: double
          nullable: false
          minimum: 0
          maximum: 1
          description: AI 생성물일 확률(0~1). 1에 가까울수록 AI 생성 가능성이 높다.
          example: 0.0018
        evidence:
          type: array
          nullable: false
          description: 판독 근거 카드 목록. 근거가 없으면 빈 배열.
          items:
            $ref: '#/components/schemas/Evidence'

    VideoDetectionResult:
      type: object
      required: [model, score, evidence]
      description: 영상 AI 판독 결과. 시간 구간 근거와 공간적 히트맵을 둘 다 지원하는 유일한 포맷.
      properties:
        model:
          type: string
          nullable: false
          description: 탐지에 사용된 모델 이름.
          example: dfdc
        score:
          type: number
          format: double
          nullable: false
          minimum: 0
          maximum: 1
          description: AI 생성물일 확률(0~1). 1에 가까울수록 AI 생성 가능성이 높다.
          example: 0.91
        evidence:
          type: array
          nullable: false
          description: 판독 근거 카드 목록. 근거가 없으면 빈 배열.
          items:
            $ref: '#/components/schemas/Evidence'
        evidenceImage:
          type: string
          nullable: true
          description: >-
            판독 근거 히트맵 이미지(base64 인코딩 PNG). 얼굴의 어느 부분이 의심스러운지
            시각적으로 보여준다(best-effort - 실패하면 null).

    Evidence:
      type: object
      required: [title, description, tags, startSec, endSec]
      properties:
        title:
          type: string
          nullable: false
          description: 근거 카드 제목.
          example: 시간 구간 이상 패턴
        description:
          type: string
          nullable: false
          description: 이 구간이 왜 의심스러운지에 대한 설명.
          example: 0.5초~1.2초 구간에서 합성 흔적이 감지됨
        tags:
          type: array
          nullable: false
          items:
            type: string
          example: [temporal]
        startSec:
          type: number
          format: double
          nullable: false
          minimum: 0
          description: 근거 구간 시작 시각(초).
          example: 0.5
        endSec:
          type: number
          format: double
          nullable: false
          minimum: 0
          description: 근거 구간 종료 시각(초).
          example: 1.2

    ProblemDetail:
      type: object
      description: RFC 9457 Problem Details. 모든 4xx 에러 공통 스키마.
      required: [type, title, status, errorCode]
      properties:
        type:
          type: string
          format: uri
          nullable: false
          description: 에러 유형 식별 URI.
          example: https://api.veritae.app/errors/email-already-exists
        title:
          type: string
          nullable: false
          description: 에러 유형의 사람이 읽을 수 있는 요약.
          example: Email Already Exists
        status:
          type: integer
          format: int32
          nullable: false
          description: HTTP 상태 코드.
          example: 409
        detail:
          type: string
          nullable: true
          description: 이 발생 건에 대한 상세 설명.
          example: 이미 가입된 이메일입니다.
        instance:
          type: string
          format: uri
          nullable: true
          description: 문제가 발생한 요청 경로.
          example: /api/v1/auth/signup
        errorCode:
          type: string
          nullable: false
          description: >-
            기계 판독용 에러 코드(클라이언트 분기용). 이 문서에 정의된 값 외에, 명시적으로 처리되지
            않은 프레임워크 레벨 오류(예: 지원하지 않는 media type, 지원하지 않는 HTTP method)에서는
            해당 HttpStatus의 enum 이름(예: UNSUPPORTED_MEDIA_TYPE, METHOD_NOT_ALLOWED)이 대신
            내려갈 수 있다. 닫힌 enum이 아니라 열린 문자열 집합으로 다뤄야 한다.
          example: EMAIL_ALREADY_EXISTS
        timestamp:
          type: string
          format: date-time
          nullable: true
          description: 에러 발생 시각(ISO 8601).
          example: '2026-07-17T09:00:00Z'
        violations:
          type: array
          nullable: true
          description: 입력 검증 실패(400)일 때 필드별 오류 목록. 그 외에는 생략/null.
          items:
            $ref: '#/components/schemas/Violation'

    Violation:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
          nullable: false
          description: 검증에 실패한 요청 필드명.
          example: password
        message:
          type: string
          nullable: false
          description: 필드 오류 메시지.
          example: 8~20자, 영문자와 숫자를 각각 1자 이상 포함해야 합니다.

