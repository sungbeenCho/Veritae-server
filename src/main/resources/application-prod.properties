# 운영 프로필(SPRING_PROFILES_ACTIVE=prod). application.properties 위에 덮어쓴다.
# 비밀 값과 주소는 환경변수로만 받고 기본값을 두지 않는다 - 빠지면 서버가 시작 단계에서 실패해야
# 로컬 기본값(root/1234, 임시 JWT 키)으로 조용히 뜨는 일이 없다.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
app.jwt.secret=${JWT_SECRET}
detection.service-url=${DETECTION_SERVICE_URL}

# 스키마는 Flyway(db/migration)가 만들고 바꾼다. Hibernate는 엔티티와 테이블이 맞는지 검증만 한다 -
# 운영 DB를 엔티티 변경에 따라 자동으로 고치지 않는다.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
