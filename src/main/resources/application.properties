spring.application.name=veritae-server
spring.datasource.url=jdbc:mysql://localhost:3306/veritae?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.mvc.problemdetails.enabled=true

# JWT (stateless access/refresh, ADR-0001 / docs/decisions/0002-jwt-library-and-signing-key.md).
# secret 은 JWT_SECRET 환경변수로 설정한다(HS256 요구사항을 만족하는 base64 키, >=256bit).
# 값을 비워두면(JWT_SECRET 미설정) JwtTokenProvider 가 프로세스별 임시 키를 생성한다 - 레포에
# 고정 키를 커밋해두면 그 키로 누구나 토큰을 위조할 수 있으므로 절대 기본값을 박아두지 않는다.
app.jwt.secret=${JWT_SECRET:}
app.jwt.access-token-expiry-seconds=1800
app.jwt.refresh-token-expiry-seconds=1209600

# springdoc 의 런타임 재생성 /v3/api-docs 는 이 Boot4+Jackson3 조합에서 요청 스키마를 깨뜨린다
# (docs/decisions/0002-... 참고). 대신 손으로 작성한 openapi.yaml 을 Swagger UI 가 직접 읽게 한다.
# (springdoc.api-docs.enabled=false 는 시도하지 말 것 - swagger-ui 자체가 함께 꺼져버림, 실측 확인.)
springdoc.swagger-ui.url=/openapi.yaml

# 이미지 AI 생성물 탐지 서버(veritae-detection-server, 3060Ti 데스크탑에서 상시 구동).
# 고정 IP가 아니면 데스크탑 재부팅 시 바뀔 수 있으니 그때마다 갱신 필요.
detection.service-url=${DETECTION_SERVICE_URL:http://192.168.0.3:8000}
detection.connect-timeout=5s
detection.read-timeout=60s

# 업로드 파일 크기 제한. 기본값(1MB)이 실제 폰 사진(2~10MB)과 음성 파일(최대 25MB)을
# 못 받는 문제가 있어 명시 설정한다. 정밀한 상한(이미지/음성별 최대 용량)은 각 서비스의
# validate() 에서 별도로 검증한다 - 여기는 프레임워크 레벨의 넉넉한 상한선일 뿐이다.
spring.servlet.multipart.max-file-size=30MB
spring.servlet.multipart.max-request-size=30MB
