spring.application.name=veritae-server
# 로컬 개발 기본값. 운영은 application-prod.properties가 환경변수(DB_URL 등)로만 받는다 - 기본값 없음.
spring.datasource.url=jdbc:mysql://localhost:3306/veritae?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 로컬 개발은 엔티티를 고치면 테이블이 따라 바뀌게 둔다. 운영은 Flyway가 스키마를 만들고 Hibernate는
# 검증만 한다(application-prod.properties). 그래서 Flyway는 여기서 끈다.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.flyway.enabled=false

spring.mvc.problemdetails.enabled=true

# 모달리티별로 한 필드만 채워지는 응답(AnalysisRecordSummary 등)에서 나머지 null 필드가
# 그대로 JSON 키로 나가던 문제(2026-09-23) - null 필드는 아예 키에서 빼서 해당 모달리티
# 결과만 내려가게 한다.
spring.jackson.default-property-inclusion=non_null

# JWT (stateless access/refresh, ADR-0001 / docs/decisions/0002-jwt-library-and-signing-key.md).
# secret 은 JWT_SECRET 환경변수로 설정한다(HS256 요구사항을 만족하는 base64 키, >=256bit).
# 값을 비워두면(JWT_SECRET 미설정) JwtTokenProvider 가 프로세스별 임시 키를 생성한다 - 레포에
# 고정 키를 커밋해두면 그 키로 누구나 토큰을 위조할 수 있으므로 절대 기본값을 박아두지 않는다.
app.jwt.secret=${JWT_SECRET:}
app.jwt.access-token-expiry-seconds=1800
app.jwt.refresh-token-expiry-seconds=1209600

# springdoc 의 런타임 재생성 /v3/api-docs 는 이 Boot4+Jackson3 조합에서 요청 스키마를 깨뜨린다
# (docs/decisions/0002-... 참고). 대신 손으로 작성한 openapi.yaml 을 Swagger UI 가 직접 읽게 한다.
# (springdoc.api-docs.enabled=false 는 시도하지 말 것 - swagger-ui 자체가 함께 꺼져버림, 실측 확인.)
springdoc.swagger-ui.url=/openapi.yaml

# 이미지 AI 생성물 탐지 서버(veritae-detection-server, 3060Ti 데스크탑에서 상시 구동).
# 고정 IP가 아니면 데스크탑 재부팅 시 바뀔 수 있으니 그때마다 갱신 필요.
detection.service-url=${DETECTION_SERVICE_URL:http://192.168.0.3:8000}
# 탐지 서버 접근 키(X-Detection-Key). 로컬 개발은 비워 두고 탐지 서버도 키 없이 띄운다.
detection.api-key=${DETECTION_API_KEY:}
detection.connect-timeout=5s
# 음성 분석(최대 5분/25MB 스펙)이 실측 기준 2.6분 오디오에 89초 걸렸음(2026-08-25) - 60s는
# 너무 짧아 5분짜리 파일에서 타임아웃 날 수 있어 300s로 넉넉히 늘림. 이미지/음성 공용 설정이라
# 이미지 쪽엔 영향 없음(이미지는 원래 훨씬 빨리 끝남, 상한만 늘어난 것).
detection.read-timeout=300s
# 영상 분석은 비동기(사용자를 기다리게 하지 않음)라 이미지/음성보다 훨씬 넉넉하게 잡는다.
# 실측 데이터 없음(2026-08-26 기준) - 얼굴검출+CNN 추론이 여러 프레임에 걸쳐 겹쳐 오디오보다
# 오래 걸릴 걸로 예상되나 정확한 값은 데스크탑 실측 후 조정 필요.
detection.video-read-timeout=20m

# 업로드 파일 크기 제한. 기본값(1MB)이 실제 폰 사진(2~10MB), 음성 파일(최대 25MB),
# 영상 파일(최대 100MB)을 못 받는 문제가 있어 명시 설정한다. 정밀한 상한(이미지/음성/영상별
# 최대 용량)은 각 서비스의 validate() 에서 별도로 검증한다 - 여기는 그중 가장 큰 영상 100MB
# 상한을 여유 있게 수용하는, 프레임워크 레벨의 넉넉한 상한선일 뿐이다.
spring.servlet.multipart.max-file-size=110MB
spring.servlet.multipart.max-request-size=110MB

# 분석 원본 파일 보관소(Cloudflare R2). 키는 레포에 커밋하지 않고 환경변수로만 받는다.
# 네 값 중 하나라도 비어 있으면 원본 보관을 끄고 서버는 그대로 뜬다 - 분석은 정상 동작하고,
# 기록의 mediaAvailable 이 false, 원본 다운로드는 404 MEDIA_NOT_AVAILABLE 이 된다.
media.r2.account-id=${R2_ACCOUNT_ID:}
media.r2.access-key-id=${R2_ACCESS_KEY_ID:}
media.r2.secret-access-key=${R2_SECRET_ACCESS_KEY:}
media.r2.bucket=${R2_BUCKET:}

# 영상 업로드를 처리가 끝날 때까지 두는 임시 폴더(VideoUploadFiles). 메모리 대신 디스크에 둔다.
analysis.video-upload-dir=${java.io.tmpdir}/veritae-video-uploads

# 운영에서는 Caddy(HTTPS)가 앞에서 받아 127.0.0.1로 넘긴다. 그대로면 모든 요청의 IP가 127.0.0.1로 보여
# IP별 횟수 제한이 모든 사용자를 한 사람으로 센다 - Tomcat이 내부 프록시(127.0.0.1 등)가 붙인 X-Forwarded-For를
# 믿고 실제 접속 IP를 getRemoteAddr()로 돌려주게 한다. Caddy는 바깥에서 들어온 X-Forwarded-For를 그대로 넘기지 않는다.
server.forward-headers-strategy=native

# 요청 횟수 제한(RateLimitInterceptor). 넘으면 429 TOO_MANY_REQUESTS + Retry-After(초).
# 로그인·가입·토큰 재발급은 IP마다(비밀번호 대입·가짜 계정 대량 생성 방지), 분석은 회원마다 이미지·음성·영상을 합쳐 센다
# (한 건이 GPU를 약 2분 써서 한 시간에 많아야 30건 정도라, 60번이면 직접 테스트는 막지 않고 자동 대량 요청만 막는다).
# 서버 재시작 시 처음부터 다시 센다.
rate-limit.login.max-requests=10
rate-limit.login.window=1m
rate-limit.signup.max-requests=10
rate-limit.signup.window=1h
rate-limit.refresh.max-requests=30
rate-limit.refresh.window=1m
rate-limit.analysis.max-requests=60
rate-limit.analysis.window=1h
